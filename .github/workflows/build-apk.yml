name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip project
        run: unzip -q *.zip && ls cast-trigger-flutter
      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --platforms=android --project-name cast_trigger --org com.casttrigger .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
        working-directory: cast-trigger-flutter
      - name: Bump Android compileSdk to 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts; fi
          if [ -f android/app/build.gradle ]; then sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle; fi
          if [ -f android/build.gradle.kts ]; then cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.gradle.AppExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF
          fi
          if [ -f android/build.gradle ]; then cat >> android/build.gradle <<'EOF'

          subprojects {
              plugins.withId('com.android.application') {
                  extensions.configure(com.android.build.gradle.AppExtension) {
                      compileSdkVersion 36
                  }
              }
              plugins.withId('com.android.library') {
                  extensions.configure(com.android.build.gradle.LibraryExtension) {
                      compileSdkVersion 36
                  }
              }
          }
          EOF
          fi
          grep -n "compileSdk" android/app/build.gradle* || true
        working-directory: cast-trigger-flutter
      - run: flutter pub get
        working-directory: cast-trigger-flutter
      - name: Generate launcher icon from logo artwork
        run: dart run flutter_launcher_icons
        working-directory: cast-trigger-flutter
      - run: flutter build apk --debug
        working-directory: cast-trigger-flutter
      - uses: actions/upload-artifact@v4
        with:
          name: cast-trigger-debug-apk
          path: cast-trigger-flutter/build/app/outputs/flutter-apk/app-debug.apk
