name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip project
        run: unzip -q *.zip && ls cast-trigger-flutter
      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --platforms=android --project-name cast_trigger --org com.casttrigger .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
        working-directory: cast-trigger-flutter
      - name: Set Android app display name
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          t = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"Cast &amp; Trigger\"', t, count=1)
          p.write_text(t)
          "
          grep -n "android:label" android/app/src/main/AndroidManifest.xml
        working-directory: cast-trigger-flutter
      - name: Bump Android compileSdk to 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts; fi
          if [ -f android/app/build.gradle ]; then sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle; fi
          grep -n "compileSdk" android/app/build.gradle* || true
        working-directory: cast-trigger-flutter
      - run: flutter pub get
        working-directory: cast-trigger-flutter
      - name: Generate launcher icon from logo artwork
        run: dart run flutter_launcher_icons
        working-directory: cast-trigger-flutter
      - run: flutter build apk --debug
        working-directory: cast-trigger-flutter
      - uses: actions/upload-artifact@v4
        with:
          name: cast-trigger-debug-apk
          path: cast-trigger-flutter/build/app/outputs/flutter-apk/app-debug.apk
