name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip project
        run: unzip -q *.zip && ls cast-trigger-flutter
      - run: flutter pub get
        working-directory: cast-trigger-flutter
      - run: flutter analyze
        working-directory: cast-trigger-flutter
      - run: flutter build apk --debug
        working-directory: cast-trigger-flutter
      - uses: actions/upload-artifact@v4
        with:
          name: cast-trigger-debug-apk
          path: cast-trigger-flutter/build/app/outputs/flutter-apk/app-debug.apk
